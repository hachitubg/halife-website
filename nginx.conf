events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    upstream mgf_web {
        server 222.255.214.198:9527;
    }

    # MGF.COM.VN - Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name mgf.com.vn www.mgf.com.vn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # MGF.COM.VN - HTTPS server
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name mgf.com.vn www.mgf.com.vn;
        
        client_max_body_size 100M;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;       

        ssl_certificate /etc/letsencrypt/live/mgf.com.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mgf.com.vn/privkey.pem;

        access_log /var/log/nginx/mgf.com.vn.access.log;
        error_log /var/log/nginx/mgf.com.vn.error.log;

        location / {
            proxy_pass http://mgf_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name halife.vn www.halife.vn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }
    
    # HTTPS server
    server {
        listen 443 ssl;
        server_name halife.vn www.halife.vn;

        # Tăng upload size limit ← THÊM DÒNG NÀY
        client_max_body_size 50M;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        
        # SSL certificates
        ssl_certificate /etc/letsencrypt/live/halife.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/halife.vn/privkey.pem;
        
        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Backend API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Static files
        location /images/ {
            proxy_pass http://backend/images/;
        }
    }
    
        # QUANGMINHTNA.VN - Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name quangminhtna.vn www.quangminhtna.vn;
        return 301 https://$server_name$request_uri;
    }

    # QUANGMINHTNA.VN - HTTPS server
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name quangminhtna.vn www.quangminhtna.vn;

        ssl_certificate /etc/letsencrypt/live/quangminhtna.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/quangminhtna.vn/privkey.pem;

        root /var/www/quang_minh_tna/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
